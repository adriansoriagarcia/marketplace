<!--=====================================
Home Banner
======================================-->

<div *ngIf="!preload" class="ps-home-banner">
    <div class="ps-carousel--nav-inside">
      <div class="carousel-track" [style.transform]="'translateX(' + transformValue + '%)'">
        <!-- Recorremos los slides -->
        <div *ngFor="let slide of banner_home; let i = index" class="ps-banner--market-4">
          <img [src]="path + 'img/products/' + category[i] + '/horizontal/' + slide['IMG tag']" alt="">
          <div class="ps-banner__content">
            <h4>{{ slide["H4 tag"] }}</h4>
            <h3>{{ slide["H3-1 tag"] }}</h3>
            <h3>{{ slide["H3-2 tag"] }} <br />
              <p>{{ slide["H3-3 tag"] }} <strong>{{ slide["H3-4s tag"] }}</strong></p>
            </h3>
            <a class="ps-btn" [routerLink]="'product/' + url[i]">{{ slide["Button tag"] }}</a>
          </div>
        </div>
      </div>
      <button (click)="previousSlide()">></button>
      <button (click)="nextSlide()"><</button>
    </div>
  </div>
  



<!--=====================================
Preload
======================================-->
<div *ngIf="preload" class="d-flex justify-content-center">

    <div class="spinner-border text-muted my-5"></div>

</div>
